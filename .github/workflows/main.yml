name: Build Portable Chromium

on:
  push:
    branches:
      - main
      - 'release/*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          choco install visualstudio2019buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --includeOptional"
          choco install ninja
          choco install git
          # Install depot_tools which includes gn
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          echo "$env:GITHUB_WORKSPACE/depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      # Step 4: Download Chromium source code and modify the script
      - name: Download Chromium source code
        run: |
          mkdir src
          cd src
          git clone https://github.com/chromium/chromium.git .
          # Skip lsb_release check on Windows by commenting it out in the script
          powershell -Command "(Get-Content build/install-build-deps.py) -replace 'lsb_release', '# lsb_release' | Set-Content build/install-build-deps.py"
          python3 build/install-build-deps.py || true

      # Step 5: Configure build for portable Chromium
      - name: Configure build for portable Chromium
        run: |
          cd src
          export PATH="$PATH:$(pwd)/depot_tools"
          gn gen out/Default --args='target_os="win" target_cpu="x64" is_portable_build=true'

      # Step 6: Build and Package Portable Chromium
      - name: Build and Package Portable Chromium
        run: |
          cd src
          export PATH="$PATH:$(pwd)/depot_tools"
          ninja -C out/Default chrome
          mkdir -p portable-chromium
          cp -r out/Default/chrome.exe portable-chromium/
          cp -r out/Default/resources portable-chromium/
          cp -r out/Default/locales portable-chromium/
          cp -r out/Default/icudtl.dat portable-chromium/
          cp -r out/Default/snapshot_blob.bin portable-chromium/
          cp -r out/Default/v8_context_snapshot.bin portable-chromium/
          cp -r out/Default/gen portable-chromium/
          cp -r out/Default/*.pak portable-chromium/
          cp -r out/Default/*.bin portable-chromium/
          cp -r out/Default/*.dat portable-chromium/
          powershell Compress-Archive -Path portable-chromium -DestinationPath portable-chromium.zip

      # Step 7: Upload artifact
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-chromium
          path: src/portable-chromium.zip
