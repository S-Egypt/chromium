name: Chromium Windows Portable Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        component: [browser, renderer, webrtc]
    env:
      DEPOT_TOOLS_WIN_TOOLCHAIN: 0
      CHROMIUM_BUILDTOOLS_PATH: ${{ github.workspace }}\buildtools
      CHROMIUM_USER_DATA_DIR: ${{ github.workspace }}\ChromiumPortable\Profile
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Cache Build Output
        uses: actions/cache@v3
        with:
          path: out/Default
          key: build-output-${{ runner.os }}-${{ matrix.component }}-${{ github.run_id }}
          restore-keys: build-output-${{ runner.os }}-${{ matrix.component }}-

      - name: Install Dependencies
        run: |
          choco install ninja python cmake openssl --yes
          python -m pip install --upgrade pip
          python -m pip install gn cryptography

      - name: Download depot_tools
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git ${{ github.workspace }}\depot_tools
          echo "${{ github.workspace }}\depot_tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Configure gclient
        run: |
          @'
          solutions = [
            {
              "name": "src",
              "url": "https://chromium.googlesource.com/chromium/src.git",
              "deps_file": "DEPS",
              "managed": false,
              "custom_deps": {}
            }
          ]
          custom_vars = {}
          '@ | Out-File -FilePath .gclient -Encoding utf8

      - name: Fix Depot Tools Git Config
        run: |
          if (!(Test-Path "$env:USERPROFILE/.gitconfig")) {
            New-Item -ItemType File -Path "$env:USERPROFILE/.gitconfig" -Force
          }
          git config --global depot-tools.allowGlobalGitConfig false

      - name: Sync Chromium Source
        run: |
          for ($i=0; $i -lt 3; $i++) {
            gclient sync --no-history && break
            echo "Retrying in 10 seconds..."
            Start-Sleep -s 10
          }

      - name: Set up ccache
        run: |
          vcpkg install ccache
          ccache --recache
          ccache --show-stats

      - name: Build Chromium Component
        run: |
          ccache --zero-stats
          autoninja -C out/Default ${{ matrix.component }}
          ccache --show-stats

      - name: Package Portable Chromium
        run: |
          mkdir -p ${{ github.workspace }}\ChromiumPortable
          Copy-Item -Path "out/Default/chrome.exe" -Destination "${{ github.workspace }}\ChromiumPortable\"
          echo "@echo off" > ${{ github.workspace }}\ChromiumPortable\launch.bat
          echo "openssl enc -aes-256-cbc -d -in Profile.enc -out Profile -k ${{ secrets.PROFILE_PASSWORD }}" >> ${{ github.workspace }}\ChromiumPortable\launch.bat
          echo "if %ERRORLEVEL% NEQ 0 exit /b 1" >> ${{ github.workspace }}\ChromiumPortable\launch.bat
          echo "chrome.exe --user-data-dir=Profile" >> ${{ github.workspace }}\ChromiumPortable\launch.bat
          echo "openssl enc -aes-256-cbc -in Profile -out Profile.enc -k ${{ secrets.PROFILE_PASSWORD }}" >> ${{ github.workspace }}\ChromiumPortable\launch.bat
          echo "del /s /q Profile" >> ${{ github.workspace }}\ChromiumPortable\launch.bat
          Compress-Archive -Path ${{ github.workspace }}\ChromiumPortable -DestinationPath ${{ github.workspace }}\ChromiumPortable.zip

      - name: Upload Portable Build
        uses: actions/upload-artifact@v4
        with:
          name: Chromium-Portable-Windows
          path: ${{ github.workspace }}\ChromiumPortable.zip
